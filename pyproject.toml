[project]
name = "modernglp"
version = "0.1.0"
description = "Orderbook charting platform powered by ModernGL and PyQt6"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "cryptofeed>=3.0.1",
    "moderngl>=5.13.0",
    "numpy>=2.5.3",
    "pyqt6>=6.11.0",
    "pyqtgraph>=0.14.0",
]

[project.scripts]
modernglp = "modernglp.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["modernglp"]
